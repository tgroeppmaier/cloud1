- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

# Allow rules go in before the default policy is set and UFW is enabled,
# so the SSH session running this playbook is never cut off.
- name: Allow public TCP ports
  community.general.ufw:
    rule: allow
    proto: tcp
    port: "{{ item | string }}"
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Deny all other incoming traffic by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow all outgoing traffic by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable UFW
  community.general.ufw:
    state: enabled
